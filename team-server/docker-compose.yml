# docker compose up -d --build
services:
  team:
    image: ddblack6/buggie-team-server:latest
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8791:8791"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
