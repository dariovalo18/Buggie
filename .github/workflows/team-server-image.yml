# Builds the team server's image and pushes it to Docker Hub as ddblack6/buggie-team-server.
# A tag team-server-v1.2.3 publishes 1.2.3, 1.2 and latest; a manual run publishes sha-<commit>.
# Needs the repository secret DOCKERHUB_TOKEN: a Docker Hub access token with read and write rights.
name: team-server image

on:
  push:
    tags: ['team-server-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ddblack6/buggie-team-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=team-server-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=team-server-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ddblack6
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: team-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
